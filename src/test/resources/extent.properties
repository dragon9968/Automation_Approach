# 1. Kích ho\u1EA1t giao di\u1EC7n Spark Reporter (B\u1EA3n v5 hi\u1EC7n \u0111\u1EA1i nh\u1EA5t)
extent.reporter.spark.start=true
# 2. \u0110\u01B0\u1EDDng d\u1EABn xu\u1EA5t file báo cáo (S\u1EBD n\u1EB1m trong th\u01B0 m\u1EE5c target)
extent.reporter.spark.out=target/extent-reports/ExtentReport.html

# 3. C\u1EA5u hình tiêu \u0111\u1EC1 hi\u1EC3n th\u1ECB trên Tab trình duy\u1EC7t
extent.reporter.spark.config.documentTitle=TechPanda Automation Results
# 4. Tên d\u1EF1 án hi\u1EC3n th\u1ECB \u1EDF góc báo cáo
extent.reporter.spark.config.reportTitle=TechPanda Mobile Test Report
# 5. B\u1EADt ch\u1EBF \u0111\u1ED9 n\u1EC1n t\u1ED1i (DARK MODE) cho sang ch\u1EA3nh, n\u1EBFu thích n\u1EC1n tr\u1EAFng anh \u0111\u1ED5i thành light nhé
extent.reporter.spark.config.theme=dark
extent.reporter.spark.base64imagesrc=true