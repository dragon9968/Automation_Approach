# Tên của Pipeline hiển thị trên tab Actions của GitHub
name: Automation Cross-Browser Pipeline

# 1. CẤU HÌNH ĐIỀU KIỆN KÍCH HOẠT (TRIGGER)
on:
  push:
    branches:
      - main          # Tự động chạy khi push code lên nhánh main
      - '**'          # Tự động chạy khi push code lên BẤT KỲ nhánh mới nào
  pull_request:
    branches:
      - main          # Tự động chạy khi có Pull Request (PR) tạo vào nhánh main

# 2. DANH SÁCH CÁC CÔNG VIỆC (JOBS) CẦN THỰC THI
jobs:
  cross-browser-test:
    # Tên hiển thị động của từng luồng chạy (Ví dụ: Test on chrome, Test on firefox...)
    name: Test on ${{ matrix.browser }}
    
    # Chỉ định loại máy ảo của GitHub để chạy test (Ở đây dùng Linux Ubuntu)
    runs-on: ubuntu-latest

    # 🌟 3. CƠ CHẾ CHẠY SONG SONG (MATRIX STRATEGY)
    strategy:
      # fail-fast = false: Nếu 1 trình duyệt bị Fail, 2 trình duyệt còn lại VẪN TIẾP TỤC CHẠY cho đến hết (không bị ngắt ngang)
      fail-fast: false
      
      # Ma trận biến: GitHub Actions sẽ nhân bản Job này thành 3 máy ảo chạy SONG SONG cùng lúc cho 3 trình duyệt bên dưới
      matrix:
        browser: [chrome, firefox, edge]

    # 4. CÁC BƯỚC THỰC THI THỰC TẾ TRÊN MỖI MÁY ẢO (STEPS)
    steps:
      # Bước 4.1: Kéo (Pull) toàn bộ code từ GitHub Repository về máy ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Bước 4.2: Tải và cài đặt môi trường Java 21 trên máy ảo
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Bật cache thư viện Maven để các lần chạy sau nhanh hơn

      # Bước 4.3: Lệnh gõ chạy Test Automation Maven
      # -Dbrowser=${{ matrix.browser }}: Truyền tham số trình duyệt động (chrome/firefox/edge) vào file BaseTest của Java
      - name: Run Automation Tests
        run: mvn test -Dbrowser=${{ matrix.browser }}

      # Bước 4.4: Thu gom tất cả các file Report sinh ra và đẩy lên GitHub Actions làm Artifacts
      - name: Upload Test Report
        if: always() # QUAN TRỌNG: Đảm bảo bước này LUÔN CHẠY kể cả khi test case bị FAIL
        uses: actions/upload-artifact@v4
        with:
          # Đặt tên file .zip tải về tương ứng với từng trình duyệt (Ví dụ: Test-Report-chrome)
          name: Test-Report-${{ matrix.browser }}
          
          # Chỉ định các thư mục chứa báo cáo cần gom lại
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            target/extent-reports/
            allure-results/

          # Thời gian lưu trữ file report trên GitHub (Sau 7 ngày sẽ tự động xóa cho nhẹ server)
          retention-days: 7