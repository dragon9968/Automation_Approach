name: Automation Cross-Browser Pipeline

# Trigger kích hoạt Workflow
on:
  push:
    branches:
      - main
      - '**'          # Tự động chạy khi push code lên bất kỳ nhánh mới nào
  pull_request:
    branches:
      - main          # Tự động chạy khi có PR tạo ra hoặc merge vào nhánh main

jobs:
  cross-browser-test:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest

    # Matrix Strategy: Tạo 3 Worker chạy song song 3 trình duyệt cùng lúc
    strategy:
      fail-fast: false  # Nếu 1 trình duyệt fail, 2 trình duyệt còn lại vẫn chạy bình thường
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      # 1. Kéo code mới nhất từ repository về máy ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cấu hình môi trường Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Kích hoạt chạy test case với từng tham số trình duyệt tương ứng
      - name: Run Automation Tests
        run: mvn test -Dbrowser=${{ matrix.browser }}