name: Automation Cross-Browser Pipeline

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  cross-browser-test:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Automation Tests
        run: mvn test -Dbrowser=${{ matrix.browser }}

      # 🌟 BƯỚC MỚI BỔ SUNG: Upload HTML Report làm Artifacts
      - name: Upload Test Report
        if: always() # Luôn chạy bước này kể cả khi test case bị FAIL
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report-${{ matrix.browser }} # Tên file report tương ứng từng browser
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            allure-results/
          retention-days: 7 # Lưu trữ report trong 7 ngày trên GitHub