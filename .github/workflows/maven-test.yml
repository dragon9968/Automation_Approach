name: Automation Cross-Browser Pipeline

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  cross-browser-test:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest

    # Khởi tạo Postgres Service bằng Docker
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          # 🌟 1. Lấy mật khẩu Docker Container từ GitHub Secret
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Database Schema
        env:
          # 🌟 2. Lấy mật khẩu psql CLI từ GitHub Secret
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h localhost -U postgres -d postgres -c "
          CREATE TABLE IF NOT EXISTS users_test (
              email VARCHAR(255) PRIMARY KEY,
              pass VARCHAR(255),
              status VARCHAR(50)
          );"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Automation Tests
        env:
          # 🌟 3. Truyền DB_PASS từ Secret vào Biến môi trường hệ thống cho Java đọc
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        # 🌟 4. Truyền thêm tham số -Denv=dev (hoặc qa) để chọn môi trường
        run: mvn test -Dbrowser=${{ matrix.browser }} -Denv=dev

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report-${{ matrix.browser }}
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            target/extent-reports/
            allure-results/
          retention-days: 7

      - name: 📤 Upload Failed Screenshots as Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-screenshots-${{ matrix.browser }}
          path: target/screenshots/
          retention-days: 7